<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Hospetagem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-fundo text-texto">
  <main class="min-h-screen md:grid md:grid-cols-2">
    <section class="hidden md:flex flex-col justify-center bg-primaria text-white p-12">
      <p class="text-3xl font-extrabold">🐾 Hospetagem</p>
      <h1 class="text-4xl lg:text-5xl font-extrabold mt-8 leading-tight">Seu pet bem cuidado enquanto você viaja.</h1>
      <p class="mt-4 text-lg text-white/80">Encontre anfitriões de confiança perto de você.</p>
      <p class="text-8xl mt-10">🐶🐱</p>
    </section>

    <section class="flex items-center justify-center p-6 min-h-screen">
      <div class="w-full max-w-sm">
        <p class="md:hidden text-3xl font-extrabold text-primaria text-center mb-10">🐾 Hospetagem</p>

        <h2 class="text-2xl font-extrabold">Entrar</h2>
        <p class="text-gray-500 mt-1">Que bom te ver de novo!</p>

        <form class="mt-6 space-y-4">
          <div>
            <label for="email" class="rotulo">E-mail</label>
            <input id="email" type="email" placeholder="voce@email.com" class="campo">
          </div>
          <div>
            <label for="senha" class="rotulo">Senha</label>
            <input id="senha" type="password" placeholder="Sua senha" class="campo">
          </div>
          <a href="#" class="block text-sm text-primaria font-semibold text-right">Esqueci minha senha</a>
          <a href="busca.html" class="botao-primario block text-center">Entrar</a>
        </form>

        <p class="text-center text-sm mt-8 text-gray-500">
          Ainda não tem conta?
          <a href="cadastro.html" class="font-bold text-primaria">Cadastre-se</a>
        </p>
      </div>
    </section>
  </main>
</body>
</html>
